<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hormus Stress-Dashboard 2026 · Physik der Weltwirtschaft</title>
<style>
:root {
  --bg: #0a0c10;
  --surface: #111318;
  --surface2: #1a1d25;
  --border: #252830;
  --border2: #2e3240;
  --ink: #e8eaf0;
  --ink2: #9aa0b4;
  --ink3: #5a6080;
  --accent-law: #4a7fd4;
  --accent-law-dim: rgba(74,127,212,0.12);
  --accent-warn: #e05a2b;
  --accent-warn-dim: rgba(224,90,43,0.12);
  --accent-ok: #2ecc87;
  --accent-ok-dim: rgba(46,204,135,0.1);
  --accent-mid: #e8b84b;
  --accent-mid-dim: rgba(232,184,75,0.1);

  /* Gesetz colors */
  --g1: #c4523a; --g2: #c4753a; --g3: #4a7fd4; --g4: #9b59b6;
  --g5: #16a085; --g6: #e05a2b; --g7: #2980b9; --g8: #8e44ad;
  --g9: #27ae60; --g10: #d4a017; --g11: #e74c3c; --g12: #1abc9c;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'JetBrains Mono', 'Fira Mono', 'Consolas', monospace;
  font-size: 13px;
  line-height: 1.55;
  min-height: 100vh;
}

/* ── HEADER ─────────────────────────────────────────── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink2);
}
.header-subtitle {
  font-size: 11px;
  color: var(--ink3);
  margin-left: auto;
}
.header-badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  background: var(--accent-law-dim);
  color: var(--accent-law);
  border: 1px solid rgba(74,127,212,0.3);
  padding: 2px 8px;
  border-radius: 2px;
}

/* ── TABS ────────────────────────────────────────────── */
.tab-bar {
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  gap: 0;
}
.tab-btn {
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink3);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 12px 18px;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.tab-btn:hover { color: var(--ink2); }
.tab-btn.active {
  color: var(--accent-law);
  border-bottom-color: var(--accent-law);
}

/* ── MAIN LAYOUT ─────────────────────────────────────── */
.main { padding: 24px; max-width: 1400px; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* ── SECTION ─────────────────────────────────────────── */
.section-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

/* ── GESETZ FILTER ───────────────────────────────────── */
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
}
.filter-label {
  font-size: 10px;
  color: var(--ink3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  align-self: center;
  margin-right: 4px;
  min-width: 60px;
}
.filter-btn {
  font-family: inherit;
  font-size: 10px;
  font-weight: 700;
  padding: 4px 10px;
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--ink2);
  cursor: pointer;
  border-radius: 2px;
  letter-spacing: 0.06em;
  transition: all 0.15s;
}
.filter-btn:hover { border-color: var(--ink3); color: var(--ink); }
.filter-btn.active {
  background: var(--accent-law-dim);
  border-color: var(--accent-law);
  color: var(--accent-law);
}
.filter-btn.all.active {
  background: rgba(232,234,240,0.08);
  border-color: var(--ink2);
  color: var(--ink);
}

/* ── DATA CARDS GRID ─────────────────────────────────── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}
.data-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  transition: border-color 0.2s, opacity 0.2s;
}
.data-card.hidden { display: none; }
.data-card:hover { border-color: var(--border2); }

.card-header {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border);
}
.card-gesetz-badge {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.1em;
  padding: 3px 7px;
  border-radius: 2px;
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 1px;
}
.card-title-block { flex: 1; min-width: 0; }
.card-indicator {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-region {
  font-size: 10px;
  color: var(--ink3);
  margin-top: 2px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.card-value-block {
  text-align: right;
  flex-shrink: 0;
}
.card-value {
  font-size: 22px;
  font-weight: 700;
  line-height: 1;
  color: var(--ink);
}
.card-unit {
  font-size: 10px;
  color: var(--ink3);
  margin-top: 3px;
}
.card-trend {
  font-size: 10px;
  font-weight: 700;
  margin-top: 2px;
}
.card-trend.up { color: var(--accent-warn); }
.card-trend.down { color: var(--accent-ok); }
.card-trend.neutral { color: var(--ink3); }

.card-body { padding: 12px 16px; }
.card-law-note {
  font-size: 11px;
  color: var(--ink2);
  line-height: 1.5;
  margin-bottom: 8px;
}
.card-sparkline {
  height: 44px;
  display: flex;
  align-items: flex-end;
  gap: 3px;
  margin-top: 8px;
}
.sparkline-bar {
  flex: 1;
  border-radius: 1px 1px 0 0;
  min-height: 3px;
  transition: opacity 0.15s;
}
.sparkline-bar:hover { opacity: 0.7; }

.card-footer {
  padding: 8px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.card-date { font-size: 10px; color: var(--ink3); }
.card-source { font-size: 10px; color: var(--ink3); }
.card-source a { color: var(--accent-law); text-decoration: none; }
.card-source a:hover { text-decoration: underline; }

/* ── KATEGORIE SECTION HEADER ────────────────────────── */
.cat-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  margin-bottom: 12px;
  margin-top: 24px;
  cursor: pointer;
  transition: border-color 0.15s;
}
.cat-header:first-child { margin-top: 0; }
.cat-header:hover { border-color: var(--border2); }
.cat-icon { font-size: 18px; }
.cat-name { font-size: 12px; font-weight: 700; color: var(--ink); flex: 1; }
.cat-summary { font-size: 11px; color: var(--ink3); max-width: 600px; }
.cat-toggle { font-size: 12px; color: var(--ink3); }
.cat-cards { margin-bottom: 8px; }

/* ── AUDIT TAB ───────────────────────────────────────── */
.audit-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
  gap: 16px;
}
.audit-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
}
.audit-card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--border);
}
.audit-gesetz-badge {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.1em;
  padding: 4px 10px;
  border-radius: 2px;
  flex-shrink: 0;
}
.audit-law-name {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
}
.audit-body { padding: 14px 16px; }

.audit-question {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.5;
  margin-bottom: 12px;
  padding: 10px 12px;
  background: var(--surface2);
  border-left: 2px solid var(--accent-law);
  border-radius: 0 2px 2px 0;
}

.audit-section-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 6px;
  margin-top: 12px;
}
.audit-section-label:first-of-type { margin-top: 0; }

.audit-data-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
  gap: 8px;
}
.audit-data-row:last-child { border-bottom: none; }
.audit-data-label { font-size: 11px; color: var(--ink2); flex: 1; }
.audit-data-val {
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.audit-data-val.alert { color: var(--accent-warn); }
.audit-data-val.ok { color: var(--accent-ok); }
.audit-data-val.mid { color: var(--accent-mid); }
.audit-data-val.neutral { color: var(--ink2); }

.audit-falle {
  font-size: 11px;
  color: var(--ink2);
  line-height: 1.5;
  margin-top: 10px;
  padding: 8px 10px;
  background: var(--accent-warn-dim);
  border-left: 2px solid var(--accent-warn);
  border-radius: 0 2px 2px 0;
}
.audit-falle strong { color: var(--accent-warn); }

.audit-doerner {
  font-size: 11px;
  color: var(--ink2);
  line-height: 1.5;
  margin-top: 8px;
  padding: 8px 10px;
  background: rgba(74,127,212,0.08);
  border-left: 2px solid var(--accent-law);
  border-radius: 0 2px 2px 0;
}
.audit-doerner strong { color: var(--accent-law); }

/* ── STATUS SUMMARY ──────────────────────────────────── */
.status-bar {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.status-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  font-size: 11px;
}
.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}
.status-dot.red { background: var(--accent-warn); box-shadow: 0 0 6px var(--accent-warn); }
.status-dot.yellow { background: var(--accent-mid); }
.status-dot.green { background: var(--accent-ok); }
.status-label { color: var(--ink2); }
.status-val { color: var(--ink); font-weight: 600; }

/* ── CASCADE STYLES ─────────────────────────────────── */
.cascade-legend {
  display: flex; gap: 20px; flex-wrap: wrap;
  margin-bottom: 20px; padding: 10px 16px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; font-size: 11px; color: var(--ink2);
}
.cl-item { display: flex; align-items: center; gap: 6px; }
.cl-dot { width: 8px; height: 8px; border-radius: 50%; }

.cascade-block {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; margin-bottom: 20px; overflow: hidden;
}
.cascade-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px; border-bottom: 1px solid var(--border);
}
.cascade-status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.cascade-label { font-size: 13px; font-weight: 700; color: var(--ink); }
.cascade-subtitle { font-size: 11px; color: var(--ink3); margin-top: 2px; }
.cascade-badge {
  margin-left: auto; font-size: 9px; font-weight: 800;
  letter-spacing: 0.12em; padding: 3px 8px; border: 1px solid; border-radius: 2px;
}
.cascade-diagram { padding: 20px 18px; overflow-x: auto; }
.cascade-flow {
  display: flex; align-items: flex-start; gap: 0; flex-wrap: wrap; min-width: 600px;
}
.flow-step { display: flex; align-items: center; gap: 0; }
.flow-node {
  border: 1px solid; border-radius: 4px; padding: 10px 14px;
  min-width: 120px; transition: filter 0.15s;
}
.flow-node:hover { filter: brightness(1.15); }
.flow-gesetz { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; margin-bottom: 4px; }
.flow-label { font-size: 11px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.flow-val { font-size: 10px; color: var(--ink3); }
.flow-edge {
  display: flex; flex-direction: column; align-items: center;
  padding: 0 8px; min-width: 80px;
}
.flow-edge-label { font-size: 9px; color: var(--ink3); text-align: center; margin-bottom: 3px; max-width: 70px; }
.flow-edge-arrow { font-size: 11px; font-weight: 700; }
.cascade-footer { padding: 12px 18px; border-top: 1px solid var(--border); }
.cascade-meadows { font-size: 11px; color: var(--ink2); line-height: 1.5; margin-bottom: 6px; }
.cascade-state { font-size: 11px; color: var(--accent-warn); line-height: 1.5; }

.r1-loop-diagram {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; padding: 20px; flex-wrap: wrap;
}
.r1-node {
  width: 80px; height: 64px;
  border: 2px solid var(--gc, #666); border-radius: 4px;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; font-size: 13px; font-weight: 800;
  color: var(--gc, #666); text-align: center;
  background: color-mix(in srgb, var(--gc, #666) 12%, transparent);
  line-height: 1.3;
}
.r1-node small { font-size: 9px; font-weight: 400; color: var(--ink3); }
.r1-arrow { font-size: 18px; color: var(--ink3); text-align: center; line-height: 1.2; }
.r1-back { color: var(--accent-warn); font-size: 22px; }

/* ── DÖRNER-WARNSYSTEM ───────────────────────────────── */
.dw-header {
  display: flex; align-items: flex-start; gap: 20px;
  padding: 18px 20px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 4px;
  margin-bottom: 20px; flex-wrap: wrap;
}
.dw-score {
  display: flex; flex-direction: column; align-items: center;
  padding: 10px 20px; border-right: 1px solid var(--border); min-width: 100px;
}
.dw-score:last-of-type { border-right: none; }
.dw-score-num {
  font-size: 36px; font-weight: 800; color: var(--accent-warn);
  line-height: 1; margin-bottom: 6px;
}
.dw-score-label { font-size: 10px; color: var(--ink3); text-align: center; line-height: 1.4; }
.dw-dominant {
  flex: 1; min-width: 200px; padding-left: 8px;
}
.dw-dominant-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--ink3); margin-bottom: 10px;
}
.dw-dominant-row {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 0; border-bottom: 1px solid var(--border);
}
.dw-dominant-row:last-child { border-bottom: none; }
.dw-dominant-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dw-dominant-name { font-size: 11px; color: var(--ink2); flex: 1; }
.dw-dominant-count { font-size: 11px; font-weight: 700; color: var(--ink); }

.dw-legend {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; padding: 14px 18px; margin-bottom: 20px;
}
.dw-legend-title {
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--ink3); margin-bottom: 12px;
}
.dw-legend-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px;
}
.dw-legend-item { display: flex; gap: 10px; align-items: flex-start; }
.dw-legend-dot {
  width: 10px; height: 10px; border-radius: 50%;
  flex-shrink: 0; margin-top: 2px;
}
.dw-legend-name { font-size: 11px; font-weight: 700; color: var(--ink); }
.dw-legend-kurz { font-size: 10px; color: var(--ink2); margin-top: 1px; }
.dw-legend-src { font-size: 9px; color: var(--ink3); margin-top: 2px; font-style: italic; }

.dw-card {
  background: var(--surface); border: 1px solid;
  border-radius: 4px; margin-bottom: 16px; overflow: hidden;
}
.dw-card-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 12px 18px; gap: 16px; flex-wrap: wrap;
}
.dw-card-left { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.dw-severity-badge {
  font-size: 9px; font-weight: 800; letter-spacing: 0.1em;
  padding: 3px 8px; border-radius: 2px;
}
.dw-gesetz-badge {
  font-size: 9px; font-weight: 700; letter-spacing: 0.06em;
  padding: 3px 8px; border-radius: 2px;
}
.dw-card-vals { text-align: right; }
.dw-current-val { font-size: 20px; font-weight: 800; line-height: 1; }
.dw-unit { font-size: 11px; font-weight: 400; color: var(--ink3); }
.dw-threshold-val { font-size: 10px; color: var(--ink3); margin-top: 4px; }

.dw-card-indicator {
  font-size: 14px; font-weight: 700; color: var(--ink);
  padding: 14px 18px 4px; line-height: 1.3;
}
.dw-trigger-text {
  font-size: 11px; color: var(--ink2); padding: 0 18px 14px;
  line-height: 1.5; border-bottom: 1px solid var(--border);
}

.dw-doerner-block {
  margin: 14px 18px; padding: 10px 14px;
  border-left: 3px solid; border-radius: 0 3px 3px 0;
  background: rgba(255,255,255,0.02);
}
.dw-doerner-header { margin-bottom: 6px; }
.dw-doerner-badge {
  font-size: 10px; font-weight: 800; letter-spacing: 0.08em;
  padding: 2px 8px; border-radius: 2px; display: inline-block;
}
.dw-doerner-desc { font-size: 11px; color: var(--ink2); line-height: 1.5; }

.dw-sections {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 0; border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.dw-section {
  padding: 12px 18px;
  border-right: 1px solid var(--border);
}
.dw-section:last-child { border-right: none; }
.dw-section-label {
  font-size: 9px; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink3); margin-bottom: 6px;
}
.dw-section-text { font-size: 11px; color: var(--ink2); line-height: 1.5; }
.dw-blindspot { color: var(--accent-mid); }
.dw-gegen { color: var(--accent-ok); }

.dw-zitat {
  padding: 12px 18px; font-size: 11px; font-style: italic;
  color: var(--ink3); line-height: 1.6;
  border-top: 1px solid var(--border);
}

.dw-ok-grid { display: flex; flex-direction: column; gap: 8px; }
.dw-ok-card {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 3px;
}
.dw-ok-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-ok); flex-shrink: 0; }
.dw-ok-name { font-size: 12px; font-weight: 600; color: var(--ink); }
.dw-ok-val { font-size: 10px; color: var(--ink3); margin-top: 2px; }

@media (max-width: 900px) {
  .dw-sections { grid-template-columns: 1fr; }
  .dw-section { border-right: none; border-bottom: 1px solid var(--border); }
  .dw-section:last-child { border-bottom: none; }
}

/* ── HEBELPUNKT-SCORE ────────────────────────────────── */
.hb-diagnosis {
  display: grid; grid-template-columns: auto 1fr 2fr;
  gap: 0; background: var(--surface);
  border: 1px solid var(--accent-warn); border-radius: 4px;
  margin-bottom: 24px; overflow: hidden;
}
.hb-diag-main {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 24px 28px;
  border-right: 1px solid var(--border);
  background: rgba(224,90,43,0.06);
}
.hb-diag-score {
  font-size: 52px; font-weight: 800; color: var(--accent-warn);
  line-height: 1; margin-bottom: 8px;
}
.hb-diag-max { font-size: 22px; color: var(--ink3); }
.hb-diag-label { font-size: 11px; color: var(--ink2); text-align: center; line-height: 1.5; }

.hb-diag-stats {
  display: flex; flex-direction: column; justify-content: center;
  gap: 12px; padding: 20px 24px; border-right: 1px solid var(--border);
}
.hb-stat { }
.hb-stat-num { font-size: 24px; font-weight: 800; line-height: 1; }
.hb-stat-label { font-size: 10px; color: var(--ink3); line-height: 1.4; margin-top: 2px; }

.hb-diag-text {
  padding: 20px 24px; font-size: 11px; color: var(--ink2);
  line-height: 1.7; align-self: center;
}

.hb-bar-section {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; padding: 18px 20px; margin-bottom: 20px;
}
.hb-bars { display: flex; flex-direction: column; gap: 2px; }
.hb-bar-row {
  display: grid; grid-template-columns: 30px 140px 1fr 30px 36px 20px;
  align-items: center; gap: 10px; padding: 7px 8px;
  cursor: pointer; border-radius: 3px;
  transition: background 0.15s;
}
.hb-bar-row:hover { background: var(--surface2); }
.hb-bar-level { font-size: 11px; font-weight: 800; text-align: center; }
.hb-bar-name { font-size: 11px; color: var(--ink); font-weight: 600; }
.hb-bar-track { height: 18px; background: var(--surface2); border-radius: 2px; position: relative; overflow: hidden; }
.hb-bar-fill { height: 100%; border-radius: 2px; position: relative; overflow: hidden; }
.hb-bar-count { font-size: 13px; font-weight: 800; text-align: center; }
.hb-bar-pct { font-size: 10px; text-align: right; }
.hb-bar-toggle { font-size: 11px; color: var(--ink3); text-align: center; }

.hb-bar-desc {
  font-size: 10px; color: var(--ink3); padding: 0 8px 6px 180px;
  line-height: 1.4;
}
.hb-bar-items { padding: 6px 8px 10px 48px; }
.hb-empty { font-size: 11px; color: var(--ink3); padding: 6px 0; font-style: italic; }

.hb-item {
  padding: 10px 14px; margin-bottom: 6px; border-radius: 3px;
  border-left: 2px solid;
}
.hb-item-ok    { background: rgba(46,204,135,0.06); border-color: var(--accent-ok); }
.hb-item-limit { background: rgba(232,184,75,0.06); border-color: var(--accent-mid); }

.hb-item-header {
  display: flex; flex-wrap: wrap; gap: 8px;
  align-items: center; margin-bottom: 5px;
}
.hb-item-land   { font-size: 11px; font-weight: 700; color: var(--ink); }
.hb-item-domain { font-size: 10px; color: var(--ink3); padding: 1px 6px; background: var(--surface2); border-radius: 2px; }
.hb-item-gesetz { font-size: 10px; font-weight: 700; }
.hb-item-datum  { font-size: 10px; color: var(--ink3); margin-left: auto; }
.hb-item-wirksam { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 2px; }
.hb-item-wirksam.ok    { color: var(--accent-ok); background: rgba(46,204,135,0.1); }
.hb-item-wirksam.limit { color: var(--accent-mid); background: rgba(232,184,75,0.1); }

.hb-item-massnahme { font-size: 11px; font-weight: 600; color: var(--ink); margin-bottom: 3px; }
.hb-item-wirkung   { font-size: 11px; color: var(--ink2); margin-bottom: 3px; line-height: 1.4; }
.hb-item-grund     { font-size: 10px; color: var(--ink3); font-style: italic; line-height: 1.4; }

.hb-book-arg {
  background: var(--surface); border: 1px solid var(--accent-law);
  border-radius: 4px; padding: 18px 20px; margin-bottom: 20px;
}
.hb-book-title {
  font-size: 11px; font-weight: 700; color: var(--accent-law);
  letter-spacing: 0.06em; margin-bottom: 16px;
}
.hb-book-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;
}
.hb-book-item {
  padding: 12px 14px; background: var(--surface2);
  border-radius: 3px; border: 1px solid var(--border);
}
.hb-book-gesetz  { font-size: 11px; font-weight: 800; margin-bottom: 2px; }
.hb-book-meadows { font-size: 10px; color: var(--ink3); margin-bottom: 8px; font-style: italic; }
.hb-book-text    { font-size: 11px; color: var(--ink2); line-height: 1.55; }

/* ── RESPONSIVE ──────────────────────────────────────── */
@media (max-width: 700px) {
  .main { padding: 12px; }
  .cards-grid { grid-template-columns: 1fr; }
  .audit-grid { grid-template-columns: 1fr; }
  .header-subtitle { display: none; }
  .hb-diagnosis { grid-template-columns: 1fr; }
  .hb-bar-row { grid-template-columns: 28px 110px 1fr 26px; }
  .hb-bar-pct, .hb-bar-toggle { display: none; }
  .hb-book-grid { grid-template-columns: 1fr; }
  .dw-sections { grid-template-columns: 1fr; }
}

// RENDER: MONITORING TAB
// ═══════════════════════════════════════════════════════════
function renderMonitoring() {
  const cats = {};
  INDICATORS.forEach(ind => {
    if (!cats[ind.cat]) cats[ind.cat] = { name: ind.catName, icon: ind.catIcon, items: [] };
    cats[ind.cat].items.push(ind);
  });

  let html = '';
  Object.entries(cats).forEach(([catId, cat]) => {
    html += `
      <div class="cat-header" onclick="toggleCat('${catId}')">
        <span class="cat-icon">${cat.icon}</span>
        <span class="cat-name">${cat.name}</span>
        <span class="cat-toggle" id="toggle-${catId}">▾</span>
      </div>
      <div class="cat-cards" id="cat-${catId}">
        <div class="cards-grid">
          ${cat.items.map(ind => renderCard(ind)).join('')}
        </div>
      </div>
    `;
  });
  document.getElementById('monitoring-categories').innerHTML = html;
}

function toggleCat(catId) {
  const el = document.getElementById('cat-' + catId);
  const tog = document.getElementById('toggle-' + catId);
  if (el.style.display === 'none') {
    el.style.display = '';
    tog.textContent = '▾';
  } else {
    el.style.display = 'none';
    tog.textContent = '▸';
  }
}

// ═══════════════════════════════════════════════════════════
// RENDER: SINGLE CARD
// ═══════════════════════════════════════════════════════════
function renderCard(ind) {
  const g = GESETZE[ind.gesetz];
  const latest = ind.series[ind.series.length - 1];
  const prev = ind.series.length > 1 ? ind.series[ind.series.length - 2] : null;
  const pct = prev ? ((latest.value - prev.value) / Math.abs(prev.value) * 100).toFixed(1) : null;
  const trendClass = ind.trendDir === 'up' ? 'up' : ind.trendDir === 'down' ? 'down' : 'neutral';
  const trendSign = ind.trendDir === 'up' ? '▲' : ind.trendDir === 'down' ? '▼' : '—';
  const maxVal = Math.max(...ind.series.map(s => s.value));
  const minVal = Math.min(...ind.series.map(s => s.value));
  const barColor = ind.trendIsGood ? '#2ecc87' : '#e05a2b';

  const bars = ind.series.map(s => {
    const h = maxVal > minVal ? Math.round(((s.value - minVal) / (maxVal - minVal)) * 36 + 4) : 20;
    return `<div class="sparkline-bar" style="height:${h}px;background:${barColor};opacity:0.7" title="${s.date}: ${s.value}"></div>`;
  }).join('');

  const dateStr = latest.date.slice(0, 7);
  const valStr = latest.value >= 1000 ? latest.value.toLocaleString('de-DE') : latest.value;

  return `
    <div class="data-card" data-gesetz="${ind.gesetz}">
      <div class="card-header">
        <div class="card-gesetz-badge" style="background:${g.color}20;color:${g.color};border:1px solid ${g.color}40">
          ${ind.gesetz}
        </div>
        <div class="card-title-block">
          <div class="card-indicator">${ind.indicator}</div>
          <div class="card-region">${ind.region}</div>
        </div>
        <div class="card-value-block">
          <div class="card-value">${valStr}</div>
          <div class="card-unit">${ind.unit}</div>
          ${pct ? `<div class="card-trend ${trendClass}">${trendSign} ${Math.abs(pct)}%</div>` : ''}
        </div>
      </div>
      <div class="card-body">
        <div class="card-law-note">${ind.lawNote}</div>
        <div class="card-sparkline">${bars}</div>
      </div>
      <div class="card-footer">
        <span class="card-date">${dateStr}</span>
        <span class="card-source"><a href="${ind.source_url}" target="_blank">Quelle ↗</a></span>
      </div>
    </div>
  `;
}

function filterByGesetz(gesetz, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('#gesetz-cards .data-card').forEach(card => {
    if (gesetz === 'all' || card.dataset.gesetz === gesetz) {
      card.classList.remove('hidden');
    } else {
      card.classList.add('hidden');
    }
  });
}

        <div class="cascade-diagram">
          ${renderCascadeFlow(k)}
        </div>
        <div class="cascade-footer">
          <div class="cascade-meadows">📐 ${k.meadowsNote}</div>
          <div class="cascade-state">🔴 Systemzustand: ${k.currentState}</div>
        </div>
      </div>
    `;
  });

  // R1 loop summary
  html += `
    <div class="cascade-block" style="border-color: var(--accent-warn); margin-top: 28px;">
      <div class="cascade-header">
        <div class="cascade-status-dot" style="background:var(--accent-warn);box-shadow:0 0 12px var(--accent-warn)"></div>
        <div>
          <div class="cascade-label">R1-Loop · Vollständig aktiv (Aug 2026)</div>
          <div class="cascade-subtitle">G1 → G4 → G8 → G12 → G1 · Verstärkende Rückkopplung</div>
        </div>
      </div>
      <div class="r1-loop-diagram">
        <div class="r1-node" style="--gc:#c4523a">G1<br><small>Energie</small></div>
        <div class="r1-arrow">→<br><small style="color:var(--ink3);font-size:9px">Engpass</small></div>
        <div class="r1-node" style="--gc:#9b59b6">G4<br><small>Collateral</small></div>
        <div class="r1-arrow">→<br><small style="color:var(--ink3);font-size:9px">Pufferverlust</small></div>
        <div class="r1-node" style="--gc:#8e44ad">G8<br><small>Vertrauen</small></div>
        <div class="r1-arrow">→<br><small style="color:var(--ink3);font-size:9px">Erosion</small></div>
        <div class="r1-node" style="--gc:#1abc9c">G12<br><small>Gleichgewicht</small></div>
        <div class="r1-arrow r1-back">↩<br><small style="color:var(--accent-warn);font-size:9px;font-weight:700">RÜCKKOPPLUNG</small></div>
      </div>
      <div class="cascade-footer" style="margin-top:16px">
        <div class="cascade-meadows">Strukturelle Logik: G6 (Engpass, Meadows L1) ist Auslöser — aber G12 (Phasenverschiebung, Meadows L9) ist das eigentliche Systemrisiko. Der Loop verbindet den schwächsten mit dem stärksten Hebelpunkt.</div>
      </div>
    </div>
  `;

  document.getElementById('kaskade-content').innerHTML = html;
}

function renderCascadeFlow(k) {
  return `<div class="cascade-flow">` +
    k.nodes.map((node, i) => {
      const edge = k.edges[i];
      const isLast = i === k.nodes.length - 1;
      return `
        <div class="flow-step">
          <div class="flow-node" style="border-color:${node.color};background:${node.color}15">
            <div class="flow-gesetz" style="color:${node.color}">${node.gesetz}</div>
            <div class="flow-label">${node.label}</div>
            <div class="flow-val">${node.val}</div>
          </div>
          ${!isLast ? `
            <div class="flow-edge">
              <div class="flow-edge-label">${edge.label}</div>
              <div class="flow-edge-arrow" style="color:${edge.polarity === '+' ? '#e05a2b' : '#2ecc87'}">
                ${edge.polarity === '+' ? '→ (+)' : '→ (−)'}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }).join('') +
  `</div>`;
}

// RENDER: DÖRNER-WARNSYSTEM
// ═══════════════════════════════════════════════════════════
function renderDoerner() {
  const critical = DOERNER_TRIGGERS.filter(t => t.severity === 'critical' && t.breached);
  const warning  = DOERNER_TRIGGERS.filter(t => t.severity === 'warning'  && t.breached);
  const ok       = DOERNER_TRIGGERS.filter(t => !t.breached || t.severity === 'ok');

  // Fehler-Frequenz zählen
  const fehlerCount = {};
  DOERNER_TRIGGERS.filter(t => t.breached && t.doerner).forEach(t => {
    fehlerCount[t.doerner] = (fehlerCount[t.doerner] || 0) + 1;
  });
  const dominantFehler = Object.entries(fehlerCount).sort((a,b) => b[1]-a[1]);

  let html = `
    <!-- Systemstatus-Kopfzeile -->
    <div class="dw-header">
      <div class="dw-score">
        <div class="dw-score-num">${critical.length}</div>
        <div class="dw-score-label">Kritische Schwellenwerte<br>überschritten</div>
      </div>
      <div class="dw-score dw-score-warn">
        <div class="dw-score-num" style="color:var(--accent-mid)">${warning.length}</div>
        <div class="dw-score-label">Warnbereich</div>
      </div>
      <div class="dw-score dw-score-ok">
        <div class="dw-score-num" style="color:var(--accent-ok)">${ok.length}</div>
        <div class="dw-score-label">Stabil</div>
      </div>
      <div class="dw-dominant">
        <div class="dw-dominant-label">Dominante Dörner-Fehler</div>
        ${dominantFehler.map(([key, n]) => `
          <div class="dw-dominant-row">
            <span class="dw-dominant-dot" style="background:${DOERNER_FEHLER[key].farbe}"></span>
            <span class="dw-dominant-name">${DOERNER_FEHLER[key].name}</span>
            <span class="dw-dominant-count">×${n}</span>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- Erklärungs-Legende -->
    <div class="dw-legend">
      <div class="dw-legend-title">Dörner-Fehler-Bibliothek (aktiv in diesem Dashboard)</div>
      <div class="dw-legend-grid">
        ${Object.entries(DOERNER_FEHLER).filter(([k]) => fehlerCount[k]).map(([key, f]) => `
          <div class="dw-legend-item">
            <div class="dw-legend-dot" style="background:${f.farbe}"></div>
            <div>
              <div class="dw-legend-name">${f.name}</div>
              <div class="dw-legend-kurz">${f.kurz}</div>
              <div class="dw-legend-src">${f.quelle}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="section-label" style="margin:20px 0 14px">Kritische Alarme · ${critical.length} aktiv</div>
    ${critical.map(t => renderDoernerCard(t)).join('')}

    ${warning.length ? `
      <div class="section-label" style="margin:24px 0 14px">Warnbereich · ${warning.length} aktiv</div>
      ${warning.map(t => renderDoernerCard(t)).join('')}
    ` : ''}

    ${ok.length ? `
      <div class="section-label" style="margin:24px 0 14px">Stabil · ${ok.length} Indikatoren</div>
      <div class="dw-ok-grid">
        ${ok.map(t => `
          <div class="dw-ok-card">
            <div class="dw-ok-dot"></div>
            <div>
              <div class="dw-ok-name">${t.indicator}</div>
              <div class="dw-ok-val">${t.current} ${t.einheit} · ${t.trigger_beschreibung}</div>
            </div>
          </div>
        `).join('')}
      </div>
    ` : ''}
  `;

  document.getElementById('doerner-content').innerHTML = html;
}

function renderDoernerCard(t) {
  const severityColor = t.severity === 'critical' ? 'var(--accent-warn)' : 'var(--accent-mid)';
  const severityBg    = t.severity === 'critical' ? 'var(--accent-warn-dim)' : 'var(--accent-mid-dim)';
  const df = t.doerner ? DOERNER_FEHLER[t.doerner] : null;
  const thresholdDir  = t.direction === 'above' ? `Schwelle: >${t.threshold}` : `Schwelle: <${t.threshold}`;
  const delta = t.direction === 'above'
    ? `+${(t.current - t.threshold).toFixed(1)}`
    : `${(t.current - t.threshold).toFixed(1)}`;

  return `
    <div class="dw-card" style="border-color:${severityColor}40">
      <div class="dw-card-header" style="background:${severityBg}">
        <div class="dw-card-left">
          <div class="dw-severity-badge" style="background:${severityColor}20;color:${severityColor};border:1px solid ${severityColor}50">
            ${t.severity === 'critical' ? '⚠ KRITISCH' : '⚡ WARNUNG'}
          </div>
          <div class="dw-gesetz-badge" style="background:${t.gesetzColor}20;color:${t.gesetzColor};border:1px solid ${t.gesetzColor}40">
            ${t.gesetz} · ${t.gesetzName}
          </div>
        </div>
        <div class="dw-card-vals">
          <div class="dw-current-val" style="color:${severityColor}">${t.current} <span class="dw-unit">${t.einheit}</span></div>
          <div class="dw-threshold-val">${thresholdDir} · Abweichung: <strong>${delta}</strong></div>
        </div>
      </div>

      <div class="dw-card-indicator">${t.indicator}</div>
      <div class="dw-trigger-text">${t.trigger_beschreibung}</div>

      ${df ? `
        <div class="dw-doerner-block" style="border-left-color:${df.farbe}">
          <div class="dw-doerner-header">
            <span class="dw-doerner-badge" style="background:${df.farbe}20;color:${df.farbe}">
              Dörner-Fehler: ${df.name}
            </span>
          </div>
          <div class="dw-doerner-desc">${df.beschreibung}</div>
        </div>

        <div class="dw-sections">
          <div class="dw-section">
            <div class="dw-section-label">Systemischer Mechanismus</div>
            <div class="dw-section-text">${t.mechanismus}</div>
          </div>
          <div class="dw-section">
            <div class="dw-section-label">Blinder Fleck</div>
            <div class="dw-section-text dw-blindspot">${t.blindspot}</div>
          </div>
          <div class="dw-section">
            <div class="dw-section-label">Strukturelle Gegenmassnahme</div>
            <div class="dw-section-text dw-gegen">${t.gegenmassnahme}</div>
          </div>
        </div>

        <div class="dw-zitat">${t.zitat}</div>
      ` : ''}
    </div>
  `;
}

// ═══════════════════════════════════════════════════════════
// RENDER: HEBELPUNKT-SCORE
// ═══════════════════════════════════════════════════════════
function renderHebel() {
  // Verteilung berechnen
  const byLevel = {};
  for (let l = 1; l <= 9; l++) byLevel[l] = [];
  GEGENMASSNAHMEN.forEach(m => byLevel[m.meadows].push(m));

  const total = GEGENMASSNAHMEN.length;
  const avgLevel = (GEGENMASSNAHMEN.reduce((s, m) => s + m.meadows, 0) / total).toFixed(1);
  const wirksam  = GEGENMASSNAHMEN.filter(m => m.wirksam).length;
  const highLever = GEGENMASSNAHMEN.filter(m => m.meadows >= 6).length;

  // Kernaussage
  const l1count  = byLevel[1].length + byLevel[2].length;
  const pct_low  = Math.round(l1count / total * 100);

  let html = `
    <!-- Systemdiagnose-Kopf -->
    <div class="hb-diagnosis">
      <div class="hb-diag-main">
        <div class="hb-diag-score">${avgLevel}<span class="hb-diag-max">/9</span></div>
        <div class="hb-diag-label">Ø Hebelpunkt-Level<br><span style="color:var(--ink3);font-size:10px">aller ${total} dokumentierten Gegenmassnahmen</span></div>
      </div>
      <div class="hb-diag-stats">
        <div class="hb-stat">
          <div class="hb-stat-num" style="color:var(--accent-warn)">${pct_low}%</div>
          <div class="hb-stat-label">Massnahmen auf<br>Level 1–2 (Parameter/Puffer)</div>
        </div>
        <div class="hb-stat">
          <div class="hb-stat-num" style="color:var(--accent-mid)">${wirksam}</div>
          <div class="hb-stat-label">Massnahmen kurzfristig<br>wirksam</div>
        </div>
        <div class="hb-stat">
          <div class="hb-stat-num" style="color:var(--accent-ok)">${highLever}</div>
          <div class="hb-stat-label">Massnahmen auf<br>Level 6–9 (strukturell)</div>
        </div>
      </div>
      <div class="hb-diag-text">
        <strong style="color:var(--accent-warn)">Systemisches Versagen der kollektiven Reaktion:</strong>
        ${pct_low} % aller Gegenmassnahmen sind Parameter- oder Puffer-Eingriffe (Meadows Level 1–2).
        Nur ${highLever} von ${total} Massnahmen greifen auf struktureller Ebene (Level 6+).
        Dies ist kein Politikversagen — es ist die strukturelle Logik von Krisenreaktionen unter Zeitdruck:
        Level-1-Eingriffe wirken sofort, Level-7-Interventionen brauchen Jahre.
        Das System reagiert auf der Ebene, die es am schnellsten erreicht — nicht auf der,
        die das Problem löst.
      </div>
    </div>

    <!-- Meadows-Hierarchie-Balken -->
    <div class="hb-bar-section">
      <div class="section-label" style="margin-bottom:16px">Verteilung aller Gegenmassnahmen · Meadows-Hierarchie</div>
      <div class="hb-bars">
        ${MEADOWS_LEVELS.map(ml => {
          const items = byLevel[ml.level];
          const pct = Math.round(items.length / total * 100);
          const barW = Math.max(items.length / Math.max(...Object.values(byLevel).map(a=>a.length)) * 100, items.length > 0 ? 4 : 0);
          const isLow  = ml.level <= 2;
          const isMid  = ml.level >= 3 && ml.level <= 5;
          const isHigh = ml.level >= 6;
          const barColor = isLow ? '#c0392b' : isMid ? '#d4a017' : '#2ecc87';
          return `
            <div class="hb-bar-row" onclick="toggleHebel(${ml.level})">
              <div class="hb-bar-level" style="color:${barColor}">L${ml.level}</div>
              <div class="hb-bar-name">${ml.name}</div>
              <div class="hb-bar-track">
                <div class="hb-bar-fill" style="width:${barW}%;background:${barColor}20;border:1px solid ${barColor}40">
                  <div class="hb-bar-inner" style="width:100%;background:${barColor};opacity:0.7;height:100%;border-radius:2px"></div>
                </div>
              </div>
              <div class="hb-bar-count" style="color:${barColor}">${items.length}</div>
              <div class="hb-bar-pct" style="color:${barColor}">${pct > 0 ? pct+'%' : '—'}</div>
              <div class="hb-bar-toggle">${items.length > 0 ? '▾' : ''}</div>
            </div>
            <div class="hb-bar-desc" id="hb-desc-${ml.level}">${ml.beschreibung}</div>
            <div class="hb-bar-items" id="hb-items-${ml.level}" style="display:none">
              ${items.length === 0 ? '<div class="hb-empty">Keine dokumentierten Massnahmen auf diesem Level</div>' :
                items.map(m => `
                  <div class="hb-item ${m.wirksam ? 'hb-item-ok' : 'hb-item-limit'}">
                    <div class="hb-item-header">
                      <span class="hb-item-land">${m.land}</span>
                      <span class="hb-item-domain">${m.domain}</span>
                      <span class="hb-item-gesetz" style="color:${GESETZE[m.gesetz]?.color || '#666'}">${m.gesetz}</span>
                      <span class="hb-item-datum">${m.datum.slice(0,7)}</span>
                      <span class="hb-item-wirksam ${m.wirksam ? 'ok' : 'limit'}">${m.wirksam ? '✓ wirksam' : '⚠ begrenzt'}</span>
                    </div>
                    <div class="hb-item-massnahme">${m.massnahme}</div>
                    <div class="hb-item-wirkung">${m.wirkung}</div>
                    <div class="hb-item-grund">${m.grund}</div>
                  </div>
                `).join('')
              }
            </div>
          `;
        }).join('')}
      </div>
    </div>

    <!-- Buch-Argument-Box -->
    <div class="hb-book-arg">
      <div class="hb-book-title">📐 Meadows-Argument · Buchposition "Die Physik der Weltwirtschaft"</div>
      <div class="hb-book-grid">
        <div class="hb-book-item">
          <div class="hb-book-gesetz" style="color:var(--g6)">G6 Engpassgesetz</div>
          <div class="hb-book-meadows">→ Meadows L1 (Parameter)</div>
          <div class="hb-book-text">G6 ist der schwächste Hebelpunkt in der Gesetz-Meadows-Zuordnung — der Engpass selbst ist ein strukturelles Parameter-Phänomen. Interventionen auf L1 (Zölle, Subventionen) adressieren die Symptome, nicht die Engpass-Ursache.</div>
        </div>
        <div class="hb-book-item">
          <div class="hb-book-gesetz" style="color:var(--g12)">G12 Gleichgewichtsgesetz</div>
          <div class="hb-book-meadows">→ Meadows L9 (Selbstorganisation)</div>
          <div class="hb-book-text">G12 ist der stärkste Hebelpunkt — Paradigmenwechsel verändern die Systemlogik selbst. Die UAE "Zero-Hormuz"-Strategie ist die einzige dokumentierte L9-Massnahme. Sie ist noch nicht operativ.</div>
        </div>
        <div class="hb-book-item">
          <div class="hb-book-gesetz" style="color:var(--accent-warn)">Strukturelle Symmetrie</div>
          <div class="hb-book-meadows">→ R1-Loop: L1 → L9</div>
          <div class="hb-book-text">Die verstärkende Rückkopplung G1→G4→G8→G12 verbindet den schwächsten (L1: Energieparameter) mit dem stärksten Hebelpunkt (L9: Systemparadigma). Das ist die buchtragende Aussage: Wer nur auf L1 reagiert, beschleunigt die Kaskade.</div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('hebel-content').innerHTML = html;
}

function toggleHebel(level) {
  const el = document.getElementById('hb-items-' + level);
  if (!el) return;
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

</script>
